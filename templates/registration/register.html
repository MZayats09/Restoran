{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 380px;">
  <h1 class="mb-4">Реєстрація</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label small">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<div style="color: var(--cream-dim); font-size:.75rem;" class="mt-1">{{ field.help_text }}</div>{% endif %}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-rust w-100 py-2">Зареєструватися</button>
  </form>
  <p class="mt-3" style="color: var(--cream-dim); font-size:.9rem;">
    Вже маєш акаунт? <a href="{% url 'login' %}">Увійти</a>
  </p>
</div>
{% endblock %}
