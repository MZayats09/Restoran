# Render Blueprint — описує весь інфраструктурний стек проєкту.
# Як це використати:
#   1. Запуш цей репозиторій на GitHub.
#   2. На render.com: New -> Blueprint -> обери свій репозиторій.
#   3. Render сам прочитає цей файл, створить і вебсервіс, і базу даних,
#      згенерує SECRET_KEY і з'єднає все між собою — без ручного вводу змінних.
#   4. Після першого деплою відкрий Shell сервісу і виконай (один раз):
#        python manage.py seed_data
#        python manage.py createsuperuser

databases:
  - name: restaurant-db
    plan: free
    databaseName: restaurant
    user: restaurant

services:
  - type: web
    name: restaurant-app
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
