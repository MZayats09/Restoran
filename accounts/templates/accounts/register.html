{% extends 'base.html' %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<h2 class="mb-4">Реєстрація</h2>
<form method="post" class="col-md-6">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-brand">Зареєструватись</button>
</form>
<p class="mt-3">Вже маєте акаунт? <a href="{% url 'accounts:login' %}">Увійти</a></p>
{% endblock %}
